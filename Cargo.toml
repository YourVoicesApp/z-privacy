[workspace]
resolver = "2"
members = ["z_core", "bridges/native/z_bridge"]
# The captured red-team harness is evidence, not a crate of ours. It is kept
# out of the workspace so an ordinary `cargo build` never compiles the
# attacker, and so its pinned `Cargo.lock` is never rewritten by our builds —
# which is exactly how its hashes stay verifiable (gate G21).
exclude = ["redteam"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.lints.rust]
# `deny`, not `forbid`, since 30 September — and the difference is one file.
# Windows has no `0600` and no `O_NOFOLLOW`; guarding the vault's own file there
# needs Win32, and Win32 needs `unsafe`. The owner chose a boundary we wrote and
# can read over the same calls hidden inside a dependency. `forbid` cannot be
# lifted anywhere, so the lint is `deny` and G4a proves the single exception
# lives in `z_core/src/secure_file/windows.rs` and nowhere else.
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
