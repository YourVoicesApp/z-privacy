[workspace]
resolver = "2"
members = ["z_core", "bridges/native/z_bridge"]
# The captured red-team harness is evidence, not a crate of ours. It is kept
# out of the workspace so an ordinary `cargo build` never compiles the
# attacker, and so its pinned `Cargo.lock` is never rewritten by our builds —
# which is exactly how its hashes stay verifiable (gate G21).
exclude = ["redteam"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# **1.89, and the one line that raised it** — the independent attacker's م5 and
# خ9, 17 October 2026: two copies of this program lost a write between them,
# and the answer is an exclusive lock held across a read and its write.
#
# `std::fs::File::lock` is stable since 1.89. It is `flock` on Unix and
# `LockFileEx` on Windows, which is the next platform — one shape for both — and
# the operating system releases it when a process dies, so a copy that crashes
# mid-write leaves nothing behind. Every other shape costs more than a version
# number: `flock` through `libc` needs `unsafe`, which the owner's own ruling
# allows in `secure_file/windows.rs` and nowhere else (G4a); a crate like `fs2`
# is a dependency we did not write, doing the thing the standard library now
# does; and a lock *file* with a pid in it needs a stale-lock policy, which is
# the one place this program could be argued into deleting something it did not
# write.
#
# Nothing is built with 1.85 here: this machine runs 1.98, the pinned fallback
# for the bridge's codegen is 1.97.1, and the Windows job uses the runner
# image's own toolchain and prints it in its report.
rust-version = "1.89"
license = "Apache-2.0"

[workspace.lints.rust]
# `deny`, not `forbid`, since 30 September — and the difference is one file.
# Windows has no `0600` and no `O_NOFOLLOW`; guarding the vault's own file there
# needs Win32, and Win32 needs `unsafe`. The owner chose a boundary we wrote and
# can read over the same calls hidden inside a dependency. `forbid` cannot be
# lifted anywhere, so the lint is `deny` and G4a proves the single exception
# lives in `z_core/src/secure_file/windows.rs` and nowhere else.
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

# ---------------------------------------------------------------- what ships
# **A release says nothing about the machine that built it.**
#
# The independent attacker's خ3 and ن6, 17 October: `lib/libz_bridge.so` in the
# installed release carried **195** strings of the form
#
#     /home/<user>/.cargo/registry/src/index.crates.io-…/<crate>-<version>/…
#
# — the panic locations of every dependency, among them
# `ring-…/src/ec/suite_b/private_key.rs` — and the file was `not stripped`.
# Neither half is a secret. Together they are one developer's machine, and its
# user name, inside a binary we ask strangers to trust.
#
# Both are build settings, so they are fixed in the build file rather than in
# the script that packs the archive: anybody who runs `cargo build --release`
# gets the same binary, whatever they pack it with.
[profile.release]
# No symbol table left to read the machine out of. One line, every builder.
strip = "symbols"
# The paths themselves are **not** fixable here on this toolchain: Cargo's own
# `trim-paths = "all"` is still unstable in the cargo of this build (1.98.0,
# «the package requires the Cargo feature called trim-paths»), and the stable
# way of saying it — `--remap-path-prefix` — needs an absolute path that is
# different on every machine, which a file in the repository cannot know. So
# the remapping lives in `scripts/package_linux.sh`, where `$HOME` is known,
# and the gate reads the finished archive rather than trusting either of them.
# The day this toolchain's cargo stabilises `trim-paths`, two lines here
# replace that.
