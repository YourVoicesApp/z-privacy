# What a Windows machine says about Z Privacy, in two jobs.
#
# `core` was the first question — does the Rust core compile there, do its tests
# hold, and is the storage protection layer actually measured. `app` is the
# second: does the whole desktop application build, runner and bridge and all.
#
# Nothing is fixed before this has answered. Z Privacy has never been built or
# tested off Linux — `secure_file.rs` guards the vault entirely under
# `#[cfg(unix)]` — so a red run here is the report we are asking for, not a
# failure to hide. (The second half of that sentence was true when it was
# written and is not any more: the data directory stopped being a guess in Dart
# when `z_core/src/data_dir.rs` was given the job, and it answers
# `%LOCALAPPDATA%\ZPrivacy` here.)
#
# It runs on `main` as well as on this branch. That is the whole of what the
# merge changed: a workflow that triggers on a branch which no longer receives
# commits does not fail — it stops running, and a build that stops silently is
# the one nobody notices is gone. Since 5 Oct 2026 it is manual only: see
# the trigger below.
name: windows

on:
  # Manual only while Linux is the development platform (the owner, 5 Oct
  # 2026): Windows is built when a milestone is to be tested on a Windows
  # machine, from the Actions tab's «Run workflow», and never on a push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: build and test z_core on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The runner image ships a Rust toolchain. Using it rather than a
      # third-party setup action keeps this to one dependency we did not write,
      # and the printed version is part of the report.
      - name: Toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          echo "workspace rust-version: $(grep -m1 'rust-version' Cargo.toml)"

      # Split from the tests on purpose: «it does not compile» and «it compiles
      # and something is wrong» are different answers, and the step that fails
      # says which one we got.
      #
      # **All three test-only features, not one and not two.** `test_clock`
      # arrived in October and this file still asked for `fake_provider`
      # alone, so six tests — the auto-lock and the Safe column's reveal,
      # `reveal_and_the_lock.rs` and `the_safe_column_reveal.rs` — did not
      # exist in this job and it reported green without them. **And it had
      # happened a second time by 093**: Linux had added `measuring` to its own
      # `TEST_FEATURES` and this file still asked for two, so the instruments'
      # own tests did not exist here either — the same fault, in the same file,
      # for the third feature. G53 now holds the two lists equal, because a
      # rule written for one platform and not applied to the second is this
      # house's most expensive habit. `gates.sh` carries that rule written down beside its
      # own `TEST_FEATURES`: «a feature the suite forgets to ask for takes its
      # tests with it silently». It was written for one platform and never
      # applied to the second. G23 proves the feature cannot reach `default` or
      # cross the bridge, so asking for it here costs the product nothing.
      - name: Compile the core
        shell: bash
        run: cargo build -p z_core --features fake_provider,test_clock,measuring

      - name: Compile the workspace
        shell: bash
        run: cargo build --workspace --features fake_provider,test_clock,measuring

      - name: Rust tests
        shell: bash
        run: cargo test --workspace --features fake_provider,test_clock,measuring -- --nocapture

      # What build is this? The owner looked at the download page and thought
      # yesterday's installer was still live, because the screen said
      # `z_core 0.1.0` and the file is called `v1` whatever is inside it.
      #
      # So the stamp is read out of the binary this machine just built — not
      # worked out from the run's own variables — and it has to name the commit
      # being built. A stamp that names another commit is worse than none.
      #
      # With the same features as every step above it, for one reason: a
      # different feature set is a different build, so this line compiled
      # z_core a second time to print one sentence. Wall clock, not
      # correctness — which is why it was left out of W5 and is its own commit.
      - name: The build's own stamp
        shell: bash
        run: |
          stamp=$(cargo run -q -p z_core --example check_document --features fake_provider,test_clock,measuring | head -1)
          echo "$stamp"
          short="${GITHUB_SHA:0:7}"
          case "$stamp" in
            *"$short") echo "the stamp names this commit" ;;
            *) echo "::error::the binary says «$stamp» and this is commit $short"; exit 1 ;;
          esac
          {
            echo "### The build"
            echo ""
            echo '```'
            echo "$stamp"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The tests above pass on Windows. That is not the same as being safe:
      # six of them do not exist there at all. This step asks for those six by
      # name and is expected to fail until Windows has its own guard.
      # `always()`, because the contract report is the most useful thing this
      # job produces and a failing test above it must not take it away. The
      # first time the tests went red, this step was skipped and we lost the
      # whole picture for a mistake in one test.
      - name: Storage protection contracts
        if: always()
        shell: bash
        run: bash scripts/check_storage_contracts.sh

      # **One copy of this program writes at a time, measured where the lock is
      # a different system call** — 093 item 4, and the attacker's م5.
      #
      # On Linux G43 reads the source: `with_core` takes `one_writer_at_a_time`
      # and one place takes it. That gate is about the shape of the code and is
      # the same on every platform; what is **not** the same is the call
      # underneath it — `std::fs::File::lock` is `flock` there and `LockFileEx`
      # here — so the shape being right says nothing about two copies on
      # Windows actually taking turns.
      #
      # The measurement exists already and is portable (two processes, one
      # `writing.lock`, a ready-file handshake, forty trials in
      # `two_copies_never_lose_a_write.rs`), so the whole-workspace step above
      # has been running it here all along. **Asked for by name anyway**, for
      # the reason `check_storage_contracts.sh` was written: a test that
      # becomes `#[cfg(unix)]` one day does not fail, it stops existing, and a
      # suite that shrinks on a platform tells the truth about what it ran and
      # a lie about what is safe.
      - name: One writer at a time
        if: always()
        shell: bash
        run: |
          set -o pipefail
          log=$RUNNER_TEMP/one-writer.txt
          cargo test -p z_core --features fake_provider,test_clock,measuring \
            --test two_copies_never_lose_a_write -- --nocapture > "$log" 2>&1 || {
              tail -40 "$log"
              echo "::error::two copies lost a write, or the test would not run — see the log above"
              exit 1
            }
          ran=$(grep -c '^test two_copies_never_lose_a_write \.\.\. ok$' "$log" || true)
          if [ "$ran" != "1" ]; then
            tail -40 "$log"
            echo "::error::the one-writer measurement did not run on this platform (it is the one guard LockFileEx is under)"
            exit 1
          fi
          grep -E '^test .* ok$' "$log" | sed 's/^/  /'
          {
            echo "### The vault's own floor, on this machine"
            echo ""
            echo "- 9 storage contracts: see the step above (each asked for by name)."
            echo "- one writer at a time: **measured on Windows** — two copies, one"
            echo "  \`writing.lock\`, LockFileEx underneath, and no silent loss."
          } >> "$GITHUB_STEP_SUMMARY"

      # Read, never typed. These three numbers sat in this file for a month
      # naming `d685d7b` — 251 tests and 108 gates — while Linux had moved to
      # more than twice that. `scripts/gates.sh` now compares the two that
      # belong to the tree against every Linux run, so this table can only be
      # as stale as the last time the gates were green.
      - name: What Linux says, for comparison
        if: always()
        shell: bash
        run: |
          {
            echo "### What Linux measured"
            echo ""
            echo '```'
            sed -n '/^  /p' docs/MEASURED_ON_LINUX.txt
            echo '```'
            echo ""
            echo "Anything this Windows run reports differently is the port's work list."
          } >> "$GITHUB_STEP_SUMMARY"

  app:
    name: build the desktop app on Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # The exact SDK this was built and tested with, by URL, not «stable».
      # «stable» moves, and a build that breaks because the channel advanced
      # teaches nothing about this commit. 1.8 GB each run for now; cache it
      # when that becomes the slow part, not before.
      - name: Flutter 3.44.2
        shell: pwsh
        run: |
          $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.44.2-stable.zip"
          Invoke-WebRequest -Uri $url -OutFile flutter.zip
          Expand-Archive -Path flutter.zip -DestinationPath C:\ -Force
          Remove-Item flutter.zip
          "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Versions
        shell: bash
        run: |
          flutter --version
          rustc --version

      # **The release may not carry the name of the machine that built it** —
      # the independent attacker's خ3 and ن6, and `scripts/package_linux.sh`'s
      # own two halves. This is the first: every dependency writes the absolute
      # path it was compiled from into the binary, and on a runner those paths
      # are `D:\a\…` and `C:\Users\runneradmin\.cargo\registry\src\…`.
      #
      # Exported **before** the build, because it is the compiler that writes
      # them down, and through `$GITHUB_ENV` so that every later step — the
      # release build's own cargokit, and the debug bridge the Dart half needs
      # — is the same build. `--remap-path-prefix` and not Cargo's `trim-paths`
      # for the reason the Linux twin gives: that one is still unstable in this
      # cargo. The second half, the proof, is `scripts/package_windows.sh`.
      #
      # **And the folders are read from their own variables** — 098 item 3,
      # after the Windows session measured `.cargo\registry\src\…` **242
      # times** in an installed `z_bridge.dll` on 20 October. A typed
      # `$USERPROFILE\.cargo` is right only while nobody moves the registry:
      # `CARGO_HOME` and `RUSTUP_HOME` exist for exactly that, a runner image
      # may set either, and a prefix that does not match the path the compiler
      # recorded removes **nothing at all** — silently, because
      # `--remap-path-prefix` has no way to say «that prefix was never there».
      # The same rule item 1 follows for the redistributable folder, and the
      # homes are printed so the run says which it used.
      - name: The paths this machine would otherwise write down
        shell: bash
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          cargo_home="$CARGO_HOME"
          if [ -z "$cargo_home" ]; then cargo_home="$USERPROFILE\\.cargo"; fi
          rustup_home="$RUSTUP_HOME"
          if [ -z "$rustup_home" ]; then rustup_home="$USERPROFILE\\.rustup"; fi
          echo "cargo home:  $cargo_home"
          echo "rustup home: $rustup_home"
          remap="--remap-path-prefix=$cargo_home\\registry\\src=/crates"
          remap="$remap --remap-path-prefix=$cargo_home\\git\\checkouts=/git"
          remap="$remap --remap-path-prefix=$rustup_home\\toolchains=/rust"
          remap="$remap --remap-path-prefix=$USERPROFILE\\AppData\\Local\\Pub\\Cache=/pub"
          remap="$remap --remap-path-prefix=$GITHUB_WORKSPACE=/zprivacy"
          echo "RUSTFLAGS=${RUSTFLAGS:-} $remap" >> "$GITHUB_ENV"
          echo "$remap"

      # Says out loud what is missing rather than failing later with a linker
      # error nobody can place: a Windows desktop build needs Visual Studio's
      # C++ workload, and the runner image is supposed to carry it.
      - name: What Flutter thinks of this machine
        shell: bash
        run: flutter doctor -v

      - name: Build
        shell: bash
        working-directory: apps/flutter_app
        run: flutter build windows --release

      # The whole folder, never the .exe alone. A Flutter application on Windows
      # is the executable plus flutter_windows.dll, z_bridge.dll, the plugin
      # DLLs and `data/` beside it; the .exe on its own does not start.
      # ---------------------------------------------------------------- 098
      # **The runtime ships beside the application** — 098, after the owner
      # met a clean Windows machine on 20 October where `VCRUNTIME140.dll` was
      # missing: Node's own installer had failed on it, and a Flutter
      # application needs the same three libraries. `flutter build windows`
      # does not copy them, so the person who double-clicks our installer
      # there gets Windows' own dialogue about a missing DLL — the silence
      # `zprivacy.iss` was written to remove.
      #
      # **App-local, which is Microsoft's own name for it**, and the only shape
      # that keeps this installer's promise: `vc_redist.x64.exe` installs
      # machine-wide and asks for an administrator, which breaks
      # `PrivilegesRequired=lowest` and the per-user install the owner chose.
      # Copied beside `zprivacy.exe`, the loader finds them first and nothing
      # is installed at all.
      #
      # **Into the runner's own Release folder, which is the one place both
      # packages read:** «Stage the folder» below copies that folder into the
      # staging the zip and Inno use, and `msix:create` packages the very same
      # folder. One copy, two packages — the alternative was copying twice and
      # the day they disagreed the MSIX would ship without a runtime.
      #
      # **The path comes from the variable, never typed:** `VCToolsRedistDir`
      # is what the runner's own Visual Studio says, so a toolset bump moves
      # with it. It is read through `vswhere` when the variable is not in this
      # shell, because a developer command prompt sets it and a workflow step
      # does not inherit one.
      - name: The runtime the application needs, beside the application
        shell: pwsh
        working-directory: apps/flutter_app
        run: |
          $out = "build/windows/x64/runner/Release"
          if (-not (Test-Path $out)) { throw "no Release folder at $out" }

          $redist = $env:VCToolsRedistDir
          if (-not $redist) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path $vswhere)) { throw "no VCToolsRedistDir and no vswhere to ask" }
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw "vswhere found no Visual Studio with the C++ tools" }
            $version = (Get-Content (Join-Path $vs "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt")).Trim()
            $redist = Join-Path $vs "VC\Redist\MSVC\$version"
          }
          Write-Host "redistributable folder: $redist"
          $crt = Join-Path $redist "x64\Microsoft.VC143.CRT"
          if (-not (Test-Path $crt)) { throw "no CRT folder at $crt" }

          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            $from = Join-Path $crt $dll
            if (-not (Test-Path $from)) { throw "the runner's redistributable has no $dll at $from" }
            Copy-Item $from (Join-Path $out $dll) -Force
          }

      # **And the three are asserted where they will ship**, with the version
      # each one carries printed into the log: a copy nobody checked is a copy
      # nobody knows happened, and this job's own rule is that a missing file
      # fails it out loud rather than later on somebody's desk.
      - name: The three are in the bundle, and these are their versions
        shell: pwsh
        working-directory: apps/flutter_app
        run: |
          $out = "build/windows/x64/runner/Release"
          $missing = @()
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            $path = Join-Path $out $dll
            if (Test-Path $path) {
              $v = (Get-Item $path).VersionInfo.FileVersion
              Write-Host "$dll $v"
              "RUNTIME_$($dll -replace '[.]','_')=$v" >> $env:GITHUB_ENV
            } else {
              $missing += $dll
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::the bundle is missing $($missing -join ', ') — the application would not start on a machine without the Visual C++ runtime"
            exit 1
          }

      # **And nothing in the three files we built says who built them** — 098
      # item 3, G53's twin, run here because this is where the files are and
      # Linux cannot read them.
      #
      # The Windows session measured `C:\Users\runneradmin\.cargo\registry\src\index.crates.io-…`
      # **242 times** in an installed `z_bridge.dll` on 20 October. What it
      # measured was not this job's output — that file carried no BUILD-INFO
      # and no hash beside it — so this step proves the job rather than
      # explaining that file: the remap above is told where cargo is, and this
      # says what it did.
      #
      # **Three files, because they are the three we write**: the runner, the
      # core, and the Dart snapshot. The Microsoft runtime item 1 put beside
      # them is **not** searched, and that is a statement rather than an
      # omission — a file we did not compile cannot be remapped by us, what it
      # records about its own builder is its builder's business, and
      # `third-party/msvc-runtime-NOTICE.txt` says whose it is. The promise
      # this keeps is about the name of **our** machine.
      #
      # Read as bytes and compared as ASCII, because a path inside a binary is
      # not a line of text: Rust writes them as UTF-8 and `Select-String` over
      # a DLL reports nothing useful.
      - name: Nothing in the three files we built says who built them
        shell: pwsh
        working-directory: apps/flutter_app
        run: |
          $out = "build/windows/x64/runner/Release"
          $ours = @("zprivacy.exe", "z_bridge.dll", "data/app.so")
          $needles = @("runneradmin", "D:\a\", "\.cargo\registry", "/home/")
          $left = @()
          foreach ($name in $ours) {
            $path = Join-Path $out $name
            if (-not (Test-Path $path)) {
              Write-Host "::error::$path is not in the build, so nothing was searched"
              exit 1
            }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            foreach ($n in $needles) {
              $count = [regex]::Matches($text, [regex]::Escape($n)).Count
              if ($count -gt 0) { $left += "$name carries ${n} $count time(s)" }
            }
            Write-Host ("{0,-14} {1,12} bytes searched" -f $name, $bytes.Length)
          }
          if ($left.Count -gt 0) {
            $left | ForEach-Object { Write-Host "::error::$_" }
            Write-Host "::error::the remap did not reach those paths - read the cargo home printed earlier in this run"
            exit 1
          }
          Write-Host "no path from this machine in any of the three"

      - name: Stage the folder
        shell: bash
        working-directory: apps/flutter_app
        run: |
          out=build/windows/x64/runner/Release
          test -f "$out/zprivacy.exe" || { echo "no zprivacy.exe at $out"; exit 1; }
          mkdir -p ../../staging/zprivacy-v1-windows-x86_64
          cp -a "$out/." ../../staging/zprivacy-v1-windows-x86_64/

          # The licences travel with the files they are about.
          #
          # The Linux tarball has carried LICENSE and a `third-party/` folder
          # since it had a script at all; this folder carried neither, and the
          # installer below copies it wholesale — so every Windows copy ever
          # downloaded went out with its obligations missing. The month that
          # added «Save as PDF» added them: `pdf` is Apache-2.0 and DejaVu is
          # embedded in every file we write, and both licences require their
          # text to travel. Same five files, same names, from the same folder
          # as the Linux package — `packaging/third-party/`, which is why it is
          # no longer under `packaging/linux/`.
          dest=../../staging/zprivacy-v1-windows-x86_64
          cp -f ../../LICENSE "$dest/LICENSE"
          # **And the folder says what is in it** — 098: the three Microsoft
          # libraries are new in this release and a person who unzips it has a
          # right to know why a Microsoft DLL sits beside our program.
          cp -f ../../packaging/windows/README.txt "$dest/README.txt"
          mkdir -p "$dest/third-party"
          for f in NOTICES.txt flutter-sdk-LICENSE.txt material-icons-LICENSE.txt \
                   dejavu-LICENSE.txt dart-pdf-LICENSE.txt msvc-runtime-NOTICE.txt; do
            cp -f "../../packaging/third-party/$f" "$dest/third-party/$f"
          done
          cp -f ../../site/third-party/flutter-engine-LICENSE.txt "$dest/third-party/"

          # Generated, exactly as `scripts/package_linux.sh` does it, because
          # NOTICES.txt names this file: a notice that points at a file nobody
          # shipped is worse than no notice.
          {
            echo "The Rust crates this build links, from the tree at ${GITHUB_SHA:0:7}."
            echo "Generated in .github/workflows/windows-core.yml with cargo tree; no new tool."
            echo
            (cd ../.. && cargo tree -p z_core --edges normal --prefix none 2>/dev/null \
               | sed 's/ (\*)$//' | sort -u | grep -vE '^$')
          } > "$dest/third-party/rust-crates.txt"

          # Asked for by name, like the .exe above it. `set -e` would already
          # have stopped a missing copy; this says which promise was broken.
          for f in LICENSE third-party/NOTICES.txt third-party/rust-crates.txt; do
            test -s "$dest/$f" || { echo "nothing staged at $f — the installer would ship without it"; exit 1; }
          done

      # **The stamp, the proof and the archive** — 093 item 1, in one script
      # beside its Linux twin (`scripts/package_windows.sh`). It writes
      # `BUILD-INFO.txt` with the five lines and the two product hashes,
      # refuses if any file still carries a path from this runner, and writes
      # the `.zip` with its `.sha256` beside it. A refusal here fails the job
      # by name, which is the whole point: an archive that names the builder
      # cannot be unwritten once it is downloaded.
      - name: Stamp it, prove it carries no runner path, and zip it
        shell: bash
        run: bash scripts/package_windows.sh staging/zprivacy-v1-windows-x86_64 "$GITHUB_WORKSPACE/dist"

      - name: What is in it, and its hashes
        if: always()
        shell: bash
        run: |
          dir=staging/zprivacy-v1-windows-x86_64
          [ -d "$dir" ] || { echo "nothing staged"; exit 0; }
          {
            echo "### Z Privacy for Windows — not a release yet"
            echo ""
            echo "Built from \`$GITHUB_SHA\`. Download the artifact, unzip it into a"
            echo "folder of its own, and run \`zprivacy.exe\` from there."
            echo ""
            echo "The two files that are the product, to check after the download:"
            echo ""
            echo '```'
            (cd "$dir" && sha256sum zprivacy.exe z_bridge.dll)
            echo '```'
            echo ""
            echo "Everything in the folder:"
            echo ""
            echo '```'
            (cd "$dir" && find . -type f -printf '%10s  %p\n' | sort -k2)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          (cd "$dir" && sha256sum zprivacy.exe z_bridge.dll)

      # One file instead of thirteen.
      #
      # The folder below is still uploaded, for anyone who wants to see exactly
      # what the build produced. The installer is for everyone else: it puts the
      # thirteen files where they belong, makes the shortcuts, and registers an
      # uninstaller — so «unblock it, extract it, and never move the .exe» stops
      # being something a person has to get right.
      #
      # Inno Setup 6 is already on the runner image. The version comes from
      # pubspec.yaml so there is one place it is written down.
      - name: Package an installer
        # PowerShell, not bash, for this one step. Git Bash's MSYS layer rewrites
        # arguments on their way to a Windows program: `/DSourceDir=...` becomes
        # a path, and the usual `//D` escape for that was passed through
        # untouched, so Inno saw an option it did not know and stopped.
        # PowerShell hands the arguments over as they were written.
        shell: pwsh
        run: |
          $line = Get-Content apps/flutter_app/pubspec.yaml |
                  Where-Object { $_ -match '^version:' } |
                  Select-Object -First 1
          if (-not $line) { throw "no version in pubspec.yaml" }
          $version = ($line -replace '^version:\s*', '' -split '\+')[0].Trim()
          Write-Host "version from pubspec.yaml: $version"

          $root = (Get-Location).Path
          New-Item -ItemType Directory -Force -Path staging-installer | Out-Null

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DSourceDir=$root\staging\zprivacy-v1-windows-x86_64" `
            "/DOutDir=$root\staging-installer" `
            "/DAppVersion=$version" `
            "/DIconFile=$root\apps\flutter_app\windows\runner\resources\app_icon.ico" `
            "packaging\windows\zprivacy.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup refused the script ($LASTEXITCODE)" }

      - name: What the installer is, and its hash
        if: always()
        shell: bash
        run: |
          file=staging-installer/zprivacy-v1-windows-x86_64-setup.exe
          [ -f "$file" ] || { echo "no installer was made"; exit 0; }
          {
            echo "### The installer"
            echo ""
            echo "One file. Download it, run it, and it is installed — no unzipping,"
            echo "and no administrator password. Windows will still ask to allow an"
            echo "unsigned program: More info, then Run anyway."
            echo ""
            echo '```'
            ls -l "$file" | awk '{print $5" bytes"}'
            sha256sum "$file"
            echo '```'
            echo ""
            echo "The two lines the download page needs, which are written there by"
            echo 'hand — the page has no build step of its own, and scripts/check_site.sh'
            echo "refuses to call the site ready while \`{{WINDOWS_BUILD}}\` is unfilled:"
            echo ""
            echo '```'
            echo "$(date -u +%Y-%m-%d) · ${GITHUB_SHA:0:7}"
            sha256sum "$file" | cut -d" " -f1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$file"

      # **An MSIX for sideloading** — 093 item 3.
      #
      # Beside the Inno installer, not instead of it: the `.exe` is what a
      # person double-clicks today, and the MSIX is the shape the Microsoft
      # Store wants — so this round makes one and the owner installs it, which
      # is how we learn what a packaged app does differently before any Store
      # account exists.
      #
      # **The certificate is made here and dies here.** A sideloaded MSIX must
      # be signed, and the signature of a self-signed test certificate proves
      # nothing about origin — anybody can make one. So the private key lives
      # for the length of this step inside `RUNNER_TEMP` and is deleted with
      # the key store entry; **only the public `.cer` travels**, because the
      # owner has to trust it once before Windows will install the package.
      # Nothing is committed: a key in a repository is a key everybody has.
      # The Store's own signing is a later round (the house's note: Store +
      # MSIX are free and need no EV certificate).
      #
      # **What the owner's run will tell us, and this comment will not guess:**
      # a packaged app's `%LOCALAPPDATA%` is redirected into the package's own
      # data folder, so the vault that `z_core/src/data_dir.rs` answers with
      # may not be the folder an unpackaged build used. That is a measurement
      # for his machine, named here so the difference is expected rather than
      # discovered.
      - name: An MSIX for sideloading
        shell: pwsh
        run: |
          $password = [guid]::NewGuid().ToString()
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Z-privacy" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Z Privacy test certificate (thrown away in this job)" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $thumb = $cert.Thumbprint
          $pfx = Join-Path $env:RUNNER_TEMP "zprivacy-test.pfx"
          $cer = Join-Path $env:GITHUB_WORKSPACE "dist\zprivacy-test-certificate.cer"
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE "dist") | Out-Null
          $secret = ConvertTo-SecureString -String $password -Force -AsPlainText
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$thumb" -FilePath $pfx -Password $secret | Out-Null
          Export-Certificate -Cert "Cert:\CurrentUser\My\$thumb" -FilePath $cer | Out-Null

          Push-Location apps/flutter_app
          dart run msix:create `
            --certificate-path $pfx `
            --certificate-password $password `
            --output-path (Join-Path $env:GITHUB_WORKSPACE "dist") `
            --output-name "zprivacy-v1-windows-x86_64"
          $code = $LASTEXITCODE
          Pop-Location

          # The key goes whatever happened above it.
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          Remove-Item "Cert:\CurrentUser\My\$thumb" -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "msix:create refused ($code)" }

      - name: How to install the MSIX
        if: always()
        shell: bash
        run: |
          file=dist/zprivacy-v1-windows-x86_64.msix
          [ -f "$file" ] || { echo "no MSIX was made"; exit 0; }
          {
            echo "### The MSIX, for sideloading"
            echo ""
            echo '```'
            sha256sum "$file"
            echo '```'
            echo ""
            echo "Two steps, once:"
            echo ""
            echo "1. In PowerShell **as administrator**, trust the test certificate:"
            echo ""
            echo '   ```powershell'
            echo '   Import-Certificate -FilePath .\zprivacy-test-certificate.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople'
            echo '   ```'
            echo ""
            echo "2. Double-click \`zprivacy-v1-windows-x86_64.msix\` and press Install."
            echo ""
            echo "The certificate is a test one, made in this run and thrown away with"
            echo "its key: it says nothing about who built this. It is only what"
            echo "Windows asks for before it will install a package at all."
          } >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$file"

      - name: Upload the archive, its hash and the MSIX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zprivacy-v1-windows-x86_64-${{ env.SHORT_SHA }}
          path: dist
          retention-days: 30
          if-no-files-found: error

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: zprivacy-v1-windows-x86_64-setup-${{ env.SHORT_SHA }}
          path: staging-installer
          retention-days: 30
          if-no-files-found: error

      # Downloading this gives `zprivacy-v1-windows-x86_64.zip`, holding one
      # folder of that name — so it unpacks into its own place rather than
      # scattering twenty files wherever it was opened. Kept beside the
      # installer: it is what the build actually made, with nothing added.
      #
      # `always()`, because the packaging step above it can fail on its own and
      # a working build must not be thrown away with it. The first time it did
      # fail, this upload was skipped and there was nothing to hand anybody —
      # which is the same mistake the contracts step above already guards against.
      - name: Upload the folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zprivacy-v1-windows-x86_64-folder-${{ env.SHORT_SHA }}
          path: staging
          retention-days: 30
          if-no-files-found: error

      # ---------------------------------------------------------------- item 2
      # **The Dart half runs here, and a red is the report we are asking for.**
      #
      # 074's desk audit found that the CI ran no Dart test on Windows at all,
      # so every claim about the glass was a Linux claim. The suite is 400-odd
      # tests and the things that break off Linux are exactly the things nobody
      # writes a test for: a path separator, a CRLF in a fixture, a font that
      # is not there, a `Platform.isWindows` branch nobody took.
      #
      # **Last in the job on purpose.** The release, the installer and the MSIX
      # are uploaded above; a red here must not take them away, and an
      # `always()` on an upload is a weaker promise than putting the fragile
      # step after it. And **no `continue-on-error`**: if it reds, the job reds
      # and the owner gets a list.
      #
      # The library the suite speaks through is built exactly as G7-build does
      # on Linux — the three test features, renamed `z_core/<feature>` because
      # `z_bridge` declares none of its own — because a plain
      # `flutter build windows` produces a DLL with **no** echo provider and
      # twenty tests then red while naming none of this
      # (`the_bundle_library_has_no_echo_provider`).
      #
      # **And `PATH` is the Windows `LD_LIBRARY_PATH`.** The documented Linux
      # recipe exports `LD_LIBRARY_PATH=…/bundle/lib`; Windows has no such
      # variable. `LoadLibrary("z_bridge.dll")` searches the directory of the
      # **executable** — which here is Flutter's own `flutter_tester.exe`
      # inside the SDK cache, not ours and not ours to write into — then the
      # system directories, then `PATH`. So the DLL is put where the Windows
      # debug bundle keeps it and that folder is prepended to `PATH`.
      - name: The library the Dart half speaks through
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cargo build -p z_bridge \
            --features z_core/fake_provider,z_core/test_clock,z_core/measuring \
            || { echo "::error::the bridge would not build with the test features"; exit 1; }
          test -f target/debug/z_bridge.dll || { echo "::error::no z_bridge.dll at target/debug"; exit 1; }
          ( cd apps/flutter_app && flutter build windows --debug ) \
            || { echo "::error::the debug build the Dart half needs would not build"; exit 1; }
          out=apps/flutter_app/build/windows/x64/runner/Debug
          test -d "$out" || { echo "::error::no debug runner folder at $out"; exit 1; }
          cp -f target/debug/z_bridge.dll "$out/z_bridge.dll"
          # **The shape, not the date** — G7-lib's own lesson: a DLL as new as
          # the tree can still be one that cannot answer. The echo provider's
          # label is compiled in only under `fake_provider`, so this is the one
          # question worth asking of the bytes.
          if LC_ALL=C grep -qa 'Echo (tests only)' "$out/z_bridge.dll"; then
            echo "the DLL the suite will speak through carries the echo provider"
          else
            echo "::error::the DLL at $out has no echo provider — the Dart half would red twenty times and name none of it"
            exit 1
          fi
          echo "DART_LIB_DIR=$out" >> "$GITHUB_ENV"

      - name: Dart tests
        if: always()
        shell: bash
        working-directory: apps/flutter_app
        run: |
          set -o pipefail
          json="$RUNNER_TEMP/dart.json"
          export PATH="$GITHUB_WORKSPACE/$DART_LIB_DIR:$PATH"
          flutter test --concurrency=1 --reporter compact --file-reporter="json:$json" \
            2>&1 | tail -40 && status=0 || status=$?
          {
            echo "### The Dart half, on Windows"
            echo ""
            if [ "$status" = "0" ]; then
              echo "Green. The glass answers through a Windows DLL."
            else
              echo "Red — which is the report this job exists for. The tests that failed,"
              echo "by file:"
              echo ""
              echo '```'
              if [ -f "$json" ]; then
                python ../../scripts/dart_failures.py "$json" 2>/dev/null \
                  || python3 ../../scripts/dart_failures.py "$json" 2>/dev/null \
                  || echo "(the JSON record is at $json; dart_failures.py would not run)"
              else
                echo "(no JSON record was written — the suite did not start)"
              fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
