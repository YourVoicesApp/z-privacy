name: zprivacy
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # sha256 for the PDF's footer (046/O). Pure Dart, BSD-3-Clause, and already
  # under `pdf` — declared here because this code calls it directly.
  crypto: ^3.0.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  # **The sentences in one list** — 092, the owner's own words: «نحن نعمل على
  # فلوتر… نحتاج أن نعقد قوائم الجمل». Flutter's own tooling and nothing else:
  # `flutter_localizations` carries the framework's own strings in each locale,
  # `intl` is what the generated class and the ICU placeholders are built on,
  # and `gen-l10n` (see `l10n.yaml`) turns `lib/l10n/*.arb` into Dart at build
  # time. Both are first-party, speak no protocol (G5a), and bring no native
  # half.
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  # «Save as PDF» (046/O). Pure Dart — no native library, no platform channel,
  # nothing to build. `printing`, its sibling, is the one with the native half
  # and a print dialog; it is deliberately **not** here. Apache-2.0.
  #
  # G5a asks for no network package: this one speaks no protocol, and neither
  # does anything it brings (archive, barcode, bidi, image, path_parsing,
  # vector_math, xml). G5b still holds in the usual way — the UI names no socket.
  pdf: ^3.13.0
  z_bridge:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # **The MSIX packer, and it is a tool and not a dependency** — 093 item 3.
  # Nothing in `lib/` imports it; it is run once, in the Windows job, by
  # `dart run msix:create`. A dev dependency because that is where a tool the
  # build uses belongs, and pinned because a packer that moves on its own
  # would change the package the owner installs without anybody deciding to.
  msix: 3.16.8
  freezed: ^3.2.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  # 092: `lib/l10n/*.arb` become `AppLocalizations` at build time, by
  # `l10n.yaml` beside this file. Nothing is generated into the repository that
  # a build cannot make again.
  generate: true
  assets:
    # The mark, in every size the product uses. They are generated from
    # `brand/source.png` by `scripts/build_brand.py` and never edited by hand —
    # a gate rebuilds them into a temp directory and compares the bytes.
    - assets/brand/
    # DejaVu Sans, embedded in every saved PDF (046/O). Without an embedded font
    # a PDF promises Helvetica and gets whatever the reader has: ä ö ü and å ä ö
    # come out as the wrong letter or as nothing, and the file would be lying
    # about its own text. 759,720 bytes — the licence is in
    # packaging/linux/third-party/dejavu-LICENSE.txt and it is named in
    # NOTICES.txt beside the others.
    - assets/fonts/

# **What the MSIX says about itself** — 093 item 3, and every line of it is a
# placeholder until the Store names the product.
#
# `publisher` must be exactly the subject of the certificate the job signs
# with (`CN=Z-privacy`), or Windows refuses the package without saying why;
# `publisher_display_name` is the owner's working choice. `identity_name` is a
# name reserved by nobody yet — the Store hands out the real one with the
# account, and the next round pays it.
#
# **No capability but the network.** A packaged app gets nothing it does not
# ask for, and this one needs exactly one thing the sandbox withholds: the
# model it is sent to lives on the internet. It reads documents through the
# person's own file picker, which is brokered and needs no capability, so
# `broadFileSystemAccess` — which the Store makes you justify — is not asked
# for. A capability nobody needs is a promise nobody should have to read.
msix_config:
  display_name: Z Privacy
  publisher_display_name: Z-privacy
  publisher: CN=Z-privacy
  identity_name: com.zprivacy.app
  msix_version: 1.0.0.0
  logo_path: assets/brand/zprivacy-512.png
  capabilities: internetClient
  architecture: x64
  store: false
